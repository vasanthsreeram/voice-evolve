<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="tgcallskill banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#0e1730"/>
      <stop offset="100%" stop-color="#1a0f2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7cc4ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#7cc4ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7cc4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- waveform -->
  <g stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.9" filter="url(#soft)">
    <path d="M40 200 Q 70 120, 100 200 T 160 200 T 220 200 T 280 200 T 340 200 T 400 200" fill="none"/>
    <path d="M40 220 Q 70 280, 100 220 T 160 220 T 220 220 T 280 220 T 340 220 T 400 220" fill="none" opacity="0.4"/>
  </g>

  <!-- phone icon -->
  <g transform="translate(880,80)" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="0" y="0" width="120" height="200" rx="22"/>
    <line x1="48" y1="170" x2="72" y2="170"/>
    <circle cx="60" cy="40" r="3" fill="url(#accent)"/>
    <path d="M30 80 Q 60 120, 90 80" stroke-dasharray="4 6" opacity="0.6"/>
    <path d="M20 100 Q 60 150, 100 100" stroke-dasharray="4 6" opacity="0.4"/>
  </g>

  <!-- AI orb -->
  <g transform="translate(1080,90)">
    <circle cx="60" cy="80" r="70" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.5"/>
    <circle cx="60" cy="80" r="48" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>
    <circle cx="60" cy="80" r="26" fill="url(#accent)" opacity="0.85"/>
  </g>

  <!-- text -->
  <text x="40" y="120" font-family="ui-sans-serif, system-ui, 'SF Pro Display', sans-serif" font-size="68" font-weight="700" fill="#ffffff">tgcallskill</text>
  <text x="40" y="160" font-family="ui-monospace, 'SF Mono', monospace" font-size="18" fill="#9aa4bf" letter-spacing="0.04em">AI receptionist for your Telegram number</text>

  <!-- provider chips -->
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#cfd6ec">
    <g transform="translate(40,220)">
      <rect width="120" height="32" rx="16" fill="#ffffff10" stroke="#ffffff22"/>
      <text x="60" y="21" text-anchor="middle">ElevenLabs</text>
    </g>
    <g transform="translate(172,220)">
      <rect width="160" height="32" rx="16" fill="#ffffff10" stroke="#ffffff22"/>
      <text x="80" y="21" text-anchor="middle">OpenAI Realtime</text>
    </g>
    <g transform="translate(344,220)">
      <rect width="140" height="32" rx="16" fill="#ffffff10" stroke="#ffffff22"/>
      <text x="70" y="21" text-anchor="middle">Gemini Live</text>
    </g>
    <g transform="translate(496,220)">
      <rect width="90" height="32" rx="16" fill="#ffffff10" stroke="#ffffff22"/>
      <text x="45" y="21" text-anchor="middle">Telegram</text>
    </g>
  </g>
</svg>
