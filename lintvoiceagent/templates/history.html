<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>LintVoice — History</title>
<style>
    :root { color-scheme: light; }
    body { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background: #fafafa; color: #111; }
    header { padding: 12px 20px; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; gap: 16px; align-items: center; }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    header a { color: #555; font-size: 13px; text-decoration: none; }
    header a:hover { color: #000; }
    .layout { display: grid; grid-template-columns: 320px 1fr; min-height: calc(100vh - 50px); }
    .sidebar { background: #fff; border-right: 1px solid #e5e5e5; overflow-y: auto; max-height: calc(100vh - 50px); }
    .session-item { padding: 10px 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 12px; }
    .session-item:hover { background: #f5f5f5; }
    .session-item.active { background: #eef6ff; border-left: 3px solid #0a84ff; }
    .session-item .sid { font-family: ui-monospace, monospace; font-size: 10px; color: #888; }
    .session-item .preview { color: #444; margin-top: 4px; line-height: 1.3; }
    .session-item .meta { color: #999; font-size: 10px; margin-top: 4px; }
    .main { padding: 20px; overflow-y: auto; max-height: calc(100vh - 50px); }
    .empty { color: #999; font-style: italic; }
    .turn { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .turn-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .turn-header h3 { margin: 0; font-size: 13px; color: #666; }
    .latency-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .pill { padding: 3px 9px; border-radius: 10px; font-family: ui-monospace, monospace; font-size: 11px; background: #f3f4f6; border: 1px solid #e5e5e5; }
    .pill.good { background: #d4f4dd; border-color: #a3e0b5; }
    .pill.warn { background: #fff3cd; border-color: #ffe69c; }
    .pill.bad  { background: #fcd7d7; border-color: #f1a8a8; }
    .pill .label { color: #666; font-size: 10px; margin-right: 4px; }
    .chat { display: grid; grid-template-columns: 1fr; gap: 8px; }
    .msg { padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.4; }
    .msg.user { background: #111; color: #fff; align-self: end; max-width: 80%; justify-self: end; }
    .msg.bot { background: #f0f0f0; color: #111; max-width: 80%; }
    audio { width: 100%; margin-top: 6px; }
    details { background: #fafafa; border: 1px dashed #ddd; border-radius: 6px; padding: 8px 12px; font-size: 11px; color: #555; margin-top: 10px; }
    details summary { cursor: pointer; user-select: none; }
    details pre { font-family: ui-monospace, monospace; font-size: 10px; line-height: 1.5; margin: 8px 0 0; max-height: 240px; overflow: auto; }
</style>
</head>
<body>
<header>
    <h1>LintVoice History</h1>
    <a href="/">← Back to chat</a>
    <span id="loaded-count" style="margin-left:auto; color:#888; font-size:12px;"></span>
</header>
<div class="layout">
    <div class="sidebar" id="sidebar"><div class="empty" style="padding:16px;">loading…</div></div>
    <div class="main" id="main"><div class="empty">Select a session.</div></div>
</div>

<script>
function fmtMs(v) { return v == null ? '—' : v + ' ms'; }
function fmtTs(t) { return t == null ? '' : new Date(t * 1000).toLocaleString(); }
function classify(label, ms) {
    if (ms == null) return '';
    if (label === 'asr')        return ms < 300 ? 'good' : ms < 700 ? 'warn' : 'bad';
    if (label === 'llm_ttft')   return ms < 400 ? 'good' : ms < 1000 ? 'warn' : 'bad';
    if (label === 'llm_total')  return ms < 2000 ? 'good' : ms < 5000 ? 'warn' : 'bad';
    if (label === 'tts_synth')  return ms < 1000 ? 'good' : ms < 3000 ? 'warn' : 'bad';
    if (label === 'total')      return ms < 2500 ? 'good' : ms < 5000 ? 'warn' : 'bad';
    return '';
}

async function loadSessions() {
    const r = await fetch('/sessions');
    const d = await r.json();
    const sb = document.getElementById('sidebar');
    sb.innerHTML = '';
    if (!d.sessions.length) { sb.innerHTML = '<div class="empty" style="padding:16px;">No sessions yet.</div>'; return; }
    document.getElementById('loaded-count').textContent = d.sessions.length + ' session' + (d.sessions.length === 1 ? '' : 's');
    for (const s of d.sessions) {
        const div = document.createElement('div');
        div.className = 'session-item';
        div.dataset.sid = s.sid;
        div.innerHTML = `
            <div class="sid">${s.sid.slice(0,16)}…</div>
            <div class="preview">${(s.last_assistant_text || s.first_user_text || '').slice(0,100)}</div>
            <div class="meta">${s.turns} turn${s.turns === 1 ? '' : 's'} · ${fmtTs(s.mtime)}</div>
        `;
        div.onclick = () => loadSession(s.sid, div);
        sb.appendChild(div);
    }
    // Auto-open the most recent
    const first = sb.querySelector('.session-item');
    if (first) first.click();
}

async function loadSession(sid, el) {
    document.querySelectorAll('.session-item').forEach(i => i.classList.remove('active'));
    if (el) el.classList.add('active');
    const main = document.getElementById('main');
    main.innerHTML = '<div class="empty">loading…</div>';
    const r = await fetch('/sessions/' + encodeURIComponent(sid) + '/turns');
    const d = await r.json();
    main.innerHTML = '';
    for (const t of d.turns) {
        const card = document.createElement('div');
        card.className = 'turn';
        const lat = t.latency_ms || {};
        const pillRow = ['asr','llm_ttft','llm_total','tts_synth','tts_ttft','total']
            .map(k => `<span class="pill ${classify(k, lat[k])}"><span class="label">${k}</span>${fmtMs(lat[k])}</span>`).join('');

        card.innerHTML = `
            <div class="turn-header">
                <h3>Turn ${t.turn}</h3>
                <span style="color:#999;font-size:11px;">${fmtTs(t.started_at)}</span>
            </div>
            <div class="latency-row">${pillRow}</div>
            <div class="chat">
                <div class="msg user">${(t.user_text || '').replace(/</g,'&lt;')}
                    ${t.user_audio ? `<audio controls src="/sessions/${encodeURIComponent(sid)}/audio/${t.user_audio.split('/').pop()}"></audio>` : ''}
                </div>
                <div class="msg bot">${(t.assistant_text || '').replace(/</g,'&lt;')}
                    ${t.assistant_audio ? `<audio controls src="/sessions/${encodeURIComponent(sid)}/audio/${t.assistant_audio.split('/').pop()}"></audio>` : ''}
                </div>
            </div>
            <details>
                <summary>Stage timestamps (raw)</summary>
                <pre>${JSON.stringify(t.stages, null, 2)}</pre>
            </details>
        `;
        main.appendChild(card);
    }
    if (!d.turns.length) main.innerHTML = '<div class="empty">No turns in this session.</div>';
}

loadSessions();
</script>
</body>
</html>
